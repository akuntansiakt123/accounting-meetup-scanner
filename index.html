<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Scanner Accounting Meet Up 2026</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f5f5f5;
      min-height: 40px;
    }

    .success {
      background: #dff5e3 !important;
      color: #176b2c;
    }

    .error {
      background: #fde1e1 !important;
      color: #a51d1d;
    }

    .loading {
      color: #555;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      Accounting Meet Up 2026
    </h1>

    <div class="subtitle">
      Scanner Check-In
    </div>


    <div id="reader"></div>


    <div id="result">
      Arahkan kamera ke QR Code peserta
    </div>

  </div>

</div>


<script>

const resultElement =
  document.getElementById('result');


function showResult(message, type) {

  resultElement.innerHTML = message;

  resultElement.className = type || '';

}


// =====================================
// HASIL SCAN
// =====================================

function onScanSuccess(decodedText, decodedResult) {

  console.log('QR:', decodedText);

  // Hentikan scanner sementara
  html5QrcodeScanner.clear();

  showResult(
    '⏳ Memeriksa tiket...',
    'loading'
  );


  // =====================================
  // NANTI DI SINI KITA HUBUNGKAN
  // KE APPS SCRIPT
  // =====================================

  setTimeout(function() {

    showResult(
      'QR terbaca:<br><b>' +
      decodedText +
      '</b>',
      'success'
    );

  }, 500);

}


// =====================================
// ERROR SCAN
// =====================================

function onScanFailure(error) {

  // Jangan tampilkan error terus-menerus
  // karena kamera akan terus melakukan scan

}


// =====================================
// START CAMERA
// =====================================

const html5QrcodeScanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },
    false
  );


html5QrcodeScanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
